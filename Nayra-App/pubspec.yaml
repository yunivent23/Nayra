name: nayra_app
description: "Nayra — aplicación móvil accesible (registro asistido, inicio de sesión por dispositivo, PIN y voz, billetera)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  # Cliente HTTP (paquete oficial del equipo de Dart) para las rutas PROVISIONALES del backend (D-014).
  http: ^1.6.0
  # Captura de audio del micrófono como PCM 16 bits, 16 kHz, mono; el audio se mantiene solo en memoria (D-013).
  record: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Atkinson Hyperlegible (Braille Institute, SIL OFL 1.1, licencia en assets/fuentes/OFL.txt): fuente de los
  # mockups v3, diseñada para baja visión. Se incluye en la app; no se descarga en tiempo de ejecución.
  fonts:
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fuentes/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fuentes/AtkinsonHyperlegible-Bold.ttf
          weight: 700
