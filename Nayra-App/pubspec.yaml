name: nayra_app
description: "Nayra — aplicación móvil accesible (registro asistido, inicio de sesión por dispositivo, PIN y voz, billetera)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  # Lectura de la agenda del teléfono como fuente de números para transferir (D-042, 2026-10-08). Solo se lee en
  # memoria cuando la persona toca «Elegir de mis contactos»; la agenda no se guarda.
  flutter_contacts: ^2.6.0
  flutter_tts: ^4.2.5
  # Cliente HTTP (paquete oficial del equipo de Dart) para las rutas PROVISIONALES del backend (D-014).
  http: ^1.6.0
  # Captura de audio del micrófono como PCM 16 bits, 16 kHz, mono; el audio se mantiene solo en memoria (D-013).
  record: ^7.1.1
  # Reconocimiento local del comando «Iniciar sesión Nayra» con Vosk en el celular (D-081, MVP del Paso 3).
  vosk_flutter_service: ^0.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Modelo de Vosk en español (D-081). No está en el repositorio: se descarga con tool/descargar_modelo_vosk.sh.
  assets:
    - assets/modelos/
  # Atkinson Hyperlegible (Braille Institute, SIL OFL 1.1, licencia en assets/fuentes/OFL.txt): fuente de los
  # mockups v3, diseñada para baja visión. Se incluye en la app; no se descarga en tiempo de ejecución.
  fonts:
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fuentes/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fuentes/AtkinsonHyperlegible-Bold.ttf
          weight: 700
