# Pruebas contra PostgreSQL real (D-051). Solo se activan si existe NAYRA_TEST_DB_URL.
# ATENCIÓN: la base indicada se BORRA (Flyway clean) al iniciar cada contexto de prueba. Usar una base exclusiva
# de pruebas, nunca la de desarrollo. Ejemplo: NAYRA_TEST_DB_URL=jdbc:postgresql://localhost/nayra_test
spring.datasource.url=${NAYRA_TEST_DB_URL}
spring.datasource.username=${NAYRA_TEST_DB_USER:postgres}
spring.datasource.password=${NAYRA_TEST_DB_PASSWORD:}
spring.flyway.clean-disabled=false
spring.jpa.show-sql=false
