# Solo pruebas de integración: valores de prueba, no de producción. Requiere PostgreSQL (NAYRA_IT_DB_URL).
spring.datasource.url=${NAYRA_IT_DB_URL}
spring.datasource.username=${NAYRA_IT_DB_USER:postgres}
spring.datasource.password=${NAYRA_IT_DB_PASSWORD:postgres}
spring.flyway.clean-disabled=false
nayra.seguridad.pin.pepper=pepper-de-prueba
nayra.seguridad.intentos.maximo=3
nayra.seguridad.desafio.vigencia=PT90S
nayra.seguridad.sesion.duracion-maxima=PT1H
nayra.voz.token=token-de-prueba
nayra.voz.timeout-conexion=PT1S
nayra.voz.timeout-lectura=PT1S
