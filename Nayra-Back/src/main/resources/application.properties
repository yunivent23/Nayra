spring.application.name=Nayra-Backend

spring.jpa.database=postgresql
spring.jpa.show-sql=true
# D-051 (aprobada el 2026-09-27): el esquema lo crean y cambian solo las migraciones Flyway.
# Hibernate únicamente comprueba que las entidades coinciden con las tablas; nunca las crea ni las modifica.
spring.jpa.hibernate.ddl-auto=validate
# Sin sesión JPA abierta durante la petición: cada cambio se guarda explícitamente por el repositorio.
spring.jpa.open-in-view=false

# Migraciones del esquema general (D-051). El esquema biométrico tiene su propio historial (D-013).
spring.flyway.locations=classpath:db/migration/nayra
spring.flyway.schemas=nayra
spring.flyway.default-schema=nayra
# Usuario de migración distinto del de ejecución: definir SPRING_FLYWAY_USER y SPRING_FLYWAY_PASSWORD en el
# entorno (D-017: no se escriben credenciales nuevas en el repositorio). Si no se definen, Flyway usa el
# usuario de spring.datasource (solo aceptable en desarrollo local).
# Rol de ejecución que recibe los permisos de V004 (auditoría solo inserción).
spring.flyway.placeholders.rol_ejecucion=${NAYRA_DB_ROL_EJECUCION:nayra_app}
# Usuarios por servicio (V011). PROVISIONAL hasta cerrar P-4: hoy Negocio y Autenticación son una sola aplicación
# y se conectan con el usuario de ejecución; estos roles preparan la separación cuando se ejecuten por separado.
spring.flyway.placeholders.rol_negocio=${NAYRA_DB_ROL_NEGOCIO:nayra_negocio}
spring.flyway.placeholders.rol_autenticacion=${NAYRA_DB_ROL_AUTENTICACION:nayra_autenticacion}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost/nayra
spring.datasource.username=postgres
spring.datasource.password=postgre

# Sesión (D-018). APROBADO: cierre automático tras 5 minutos de inactividad, sin aviso previo.
# El mecanismo técnico de la sesión sigue pendiente (D-018).
nayra.sesion.inactividad-maxima=5m
# JWT de sesión (modelo de datos v4 §4.1). PROVISIONAL (P-5, D-017): HS256 con una clave de al menos 32 bytes en
# base64, leída del entorno; nunca en el repositorio. Si no se define, cada arranque genera una clave aleatoria en
# memoria (las sesiones no sobreviven al reinicio y dos instancias no comparten sesiones): solo para desarrollo.
nayra.sesion.jwt-clave=${NAYRA_JWT_CLAVE:}
# PROVISIONAL DEL PROTOTIPO — PENDIENTE DE VALIDACIÓN: vida del nonce de firma del dispositivo (D-048).
nayra.dispositivo.vida-nonce=60s
# PROVISIONAL DEL PROTOTIPO — PENDIENTE DE VALIDACIÓN: vida máxima de un registro (o enrolamiento) incompleto.
nayra.registro.vida-registro-en-curso=900s
