spring.application.name=Nayra-Backend

spring.jpa.database=postgresql
spring.jpa.show-sql=true
# No se crean tablas físicas hasta decidir la estrategia de migraciones (D-051, P-006).
spring.jpa.hibernate.ddl-auto=none

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost/nayra
spring.datasource.username=postgres
spring.datasource.password=postgre

# Sesión (D-018). APROBADO: cierre automático tras 5 minutos de inactividad, sin aviso previo.
# El mecanismo técnico de la sesión sigue pendiente (D-018).
nayra.sesion.inactividad-maxima=5m
# PROVISIONAL DEL PROTOTIPO — PENDIENTE DE VALIDACIÓN: vida del nonce de firma del dispositivo (D-048).
nayra.dispositivo.vida-nonce=60s
# PROVISIONAL DEL PROTOTIPO — PENDIENTE DE VALIDACIÓN: vida máxima de un registro (o enrolamiento) incompleto.
nayra.registro.vida-registro-en-curso=900s
