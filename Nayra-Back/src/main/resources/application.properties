spring.application.name=Nayra-Backend

# Base de datos: credenciales solo por variables de entorno (D-017)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${NAYRA_DB_URL:jdbc:postgresql://localhost:5432/nayra}
spring.datasource.username=${NAYRA_DB_USER}
spring.datasource.password=${NAYRA_DB_PASSWORD}

# D-052: el esquema lo crea Flyway; Hibernate solo valida
spring.jpa.database=postgresql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.schemas=public

# Audio de voz (D-045): tamaño máximo técnico configurable
spring.servlet.multipart.max-file-size=${NAYRA_AUDIO_TAMANO_MAXIMO:2MB}
spring.servlet.multipart.max-request-size=${NAYRA_SOLICITUD_TAMANO_MAXIMO:8MB}

# D-043: pepper del PIN (obligatorio, fuera del repositorio)
nayra.seguridad.pin.pepper=${NAYRA_PIN_PEPPER}

# D-047: intentos fallidos antes del bloqueo (obligatorio, valor pendiente de definir)
nayra.seguridad.intentos.maximo=${NAYRA_INTENTOS_MAXIMO}

# D-048: vida útil de desafío y nonce (obligatorio, valor pendiente de definir), formato ISO-8601 (p. ej. PT90S)
nayra.seguridad.desafio.vigencia=${NAYRA_DESAFIO_VIGENCIA}

# D-042: 5 minutos de inactividad (regla aprobada); duración máxima absoluta pendiente de definir
nayra.seguridad.sesion.inactividad=PT5M
nayra.seguridad.sesion.duracion-maxima=${NAYRA_SESION_DURACION_MAXIMA}
nayra.seguridad.sesion.intervalo-actualizacion=PT30S

# D-040: servicio de voz (solo red interna)
nayra.voz.url=${NAYRA_VOZ_URL:http://localhost:8001}
nayra.voz.token=${NAYRA_VOZ_TOKEN}
nayra.voz.timeout-conexion=${NAYRA_VOZ_TIMEOUT_CONEXION}
nayra.voz.timeout-lectura=${NAYRA_VOZ_TIMEOUT_LECTURA}

# D-038: umbrales pendientes de calibración. Sin valor => modo calibración (no autentica por voz).
nayra.umbrales.version=${NAYRA_UMBRALES_VERSION:}
nayra.umbrales.similitud-minima=${NAYRA_UMBRAL_SIMILITUD:}
nayra.umbrales.spoofing-minimo=${NAYRA_UMBRAL_SPOOFING:}
nayra.umbrales.voz-neta-minima-segundos=${NAYRA_UMBRAL_VOZ_NETA:}
nayra.umbrales.snr-minimo-db=${NAYRA_UMBRAL_SNR:}
nayra.umbrales.saturacion-maxima=${NAYRA_UMBRAL_SATURACION:}
nayra.umbrales.confianza-contenido-minima=${NAYRA_UMBRAL_CONFIANZA_CONTENIDO:}
nayra.umbrales.consistencia-enrolamiento-minima=${NAYRA_UMBRAL_CONSISTENCIA:}
