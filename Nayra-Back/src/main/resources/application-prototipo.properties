# Perfil "prototipo" — prototipo funcional AG-13 (autenticación por voz).
# Activación: --spring.profiles.active=prototipo
# Los valores marcados PROVISIONAL — PENDIENTE DE VALIDACIÓN no provienen de ningún estudio;
# fueron autorizados como provisionales el 2026-09-27 y deben calibrarse o decidirse (D-055, D-044, D-018).

# Servicio Python de voz (REST interno con FastAPI, D-010). Contrato PROVISIONAL hasta D-014.
nayra.voz.servicio-url=${NAYRA_VOZ_URL:http://localhost:8001}
# Token de servicio leído del entorno; no se escribe ningún secreto en el repositorio (D-017).
nayra.voz.servicio-token=${NAYRA_VOZ_TOKEN_SERVICIO:}
# PROVISIONAL — PENDIENTE DE VALIDACIÓN
nayra.voz.servicio-timeout-conexion=2s
# PROVISIONAL — PENDIENTE DE VALIDACIÓN (la inferencia en CPU puede tardar varios segundos)
nayra.voz.servicio-timeout-lectura=30s

# Vocabulario versionado del desafío (D-054). Lista inicial PROVISIONAL — PENDIENTE DE VALIDACIÓN.
nayra.voz.vocabulario-ruta=${NAYRA_VOCABULARIO:../shared/desafio/vocabulario_v2.json}

# PROVISIONAL — PENDIENTE DE VALIDACIÓN: vida del desafío.
nayra.voz.vida-desafio=120s
# PROVISIONAL — PENDIENTE DE VALIDACIÓN: vida de una transacción de inicio de sesión.
nayra.voz.vida-transaccion=5m
# Política de intentos PROVISIONAL (propuesta de D-044, no aprobada): 3 intentos fallidos → bloqueo.
nayra.voz.intentos-maximos=3
# 3 muestras válidas como valor inicial, provisional y pendiente de validación según D-059.
nayra.voz.muestras-enrolamiento=3

# Límite de audio en las solicitudes (coherente con el límite de 2 MB del servicio Python).
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
